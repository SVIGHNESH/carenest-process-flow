<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How CareNest Works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<style>
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;height:52px;padding:0 16px;border-bottom:1px solid var(--border);background:var(--canvas)}
.brandlink{display:flex;align-items:center;gap:8px;color:inherit;text-decoration:none;border-radius:6px}
.topbar .spacer{flex:1}
.linkbtn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--fg);font-size:13px;font-weight:500;text-decoration:none;white-space:nowrap}
.linkbtn:hover{background:var(--surface-hover)}
.wrap{max-width:600px;margin:0 auto;padding:32px 16px 64px}
h1{margin:0;font-size:26px;line-height:34px;letter-spacing:-0.02em;font-weight:600;text-align:center}
.lede{margin:6px 0 24px;font-size:15px;line-height:24px;color:var(--fg-muted);text-align:center}
.flow svg{display:block;width:100%;height:auto;font-family:'Inter',system-ui,sans-serif}
.lane{fill:var(--surface-sunken)}
.lt{fill:var(--fg);font-size:12px;font-weight:600}
.ls{fill:var(--fg-muted);font-size:10px}
.bx{stroke-width:1.25}
.b-app{fill:var(--accent-soft);stroke:var(--accent)}
.b-admin{fill:var(--warning-soft);stroke:var(--warning)}
.b-nurse{fill:var(--success-soft);stroke:var(--success)}
.bx.bad{fill:var(--danger-soft);stroke:var(--danger);stroke-dasharray:4 3}
.bx.end{fill:var(--surface);stroke:var(--border-strong)}
.bt{fill:var(--fg);font-size:12px;font-weight:600}
.bs{fill:var(--fg-secondary);font-size:10px}
.ar{fill:none;stroke:var(--fg-subtle);stroke-width:1.25}
.ar.acc{stroke:var(--accent)}
.ar.bad{stroke:var(--danger);stroke-dasharray:4 3}
.al{fill:var(--fg-muted);font-size:10px;stroke:var(--surface-sunken);stroke-width:3px;paint-order:stroke}
.al.acc{fill:var(--accent-text)}
.mk{fill:var(--fg-subtle)}.mk-acc{fill:var(--accent)}.mk-bad{fill:var(--danger)}
.notes{margin:24px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.notes li{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:20px;color:var(--fg-secondary)}
.notes i{flex-shrink:0;width:7px;height:7px;margin-top:7px;border-radius:9999px}
.more{margin-top:32px;display:flex;justify-content:center}
</style>
</head>
<body>
<header class="topbar">
<a class="brandlink focusable" href="index.html" title="All views"><span class="brandmark"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg></span><span class="brandname">CareNest</span></a>
<span class="spacer"></span>
<a class="linkbtn focusable" href="detailed.html">Detailed flow</a>
<button class="iconbtn themetoggle focusable" type="button" aria-label="Switch to dark mode"><svg class="i-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="i-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button>
</header>
<main class="wrap">
<h1>How CareNest works</h1>
<p class="lede">Three apps, one booking.</p>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-acc"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-bad"/></marker>
</defs></svg>
<div class="flow">
<svg viewBox="0 0 360 520" role="img" aria-label="How a booking moves between the CareNest app, the admin dashboard and the nurse app">
<rect class="lane l-app" x="2" y="0" width="116" height="520" rx="10"/>
<text class="lt" x="60" y="24" text-anchor="middle">CareNest app</text><text class="ls" x="60" y="40" text-anchor="middle">for families</text>
<rect class="lane l-admin" x="122" y="0" width="116" height="520" rx="10"/>
<text class="lt" x="180" y="24" text-anchor="middle">Admin dashboard</text><text class="ls" x="180" y="40" text-anchor="middle">for CareNest team</text>
<rect class="lane l-nurse" x="242" y="0" width="116" height="520" rx="10"/>
<text class="lt" x="300" y="24" text-anchor="middle">Nurse app</text><text class="ls" x="300" y="40" text-anchor="middle">for nurses</text>
<path class="ar" d="M60,106.0 V126.0" marker-end="url(#a)"/>
<path class="ar" d="M60,172.0 V192.0" marker-end="url(#a)"/>
<path class="ar acc" d="M112.0,216 H126.0" marker-end="url(#aa)"/>
<path class="ar" d="M180,238.0 V258.0" marker-end="url(#a)"/>
<path class="ar bad" d="M128.0,282 H114.0" marker-end="url(#ab)"/>
<path class="ar" d="M180,304.0 V348 H114.0" marker-end="url(#a)"/>
<text class="al" x="186" y="330" text-anchor="start">SMS</text>
<path class="ar" d="M232.0,282 H300 V324.0" marker-end="url(#a)"/>
<text class="al" x="266" y="276" text-anchor="middle">assign</text>
<path class="ar" d="M300,370.0 V390.0" marker-end="url(#a)"/>
<path class="ar" d="M300,436.0 V456.0" marker-end="url(#a)"/>
<path class="ar" d="M248.0,480 H114.0" marker-end="url(#a)"/>
<text class="al" x="180" y="473" text-anchor="middle">SMS</text>
<rect class="bx b-app" x="8" y="62" width="104" height="44" rx="8"/>
<text class="bt" x="60" y="81" text-anchor="middle">Sign up</text><text class="bs" x="60" y="96" text-anchor="middle">email + phone code</text>
<rect class="bx b-app" x="8" y="128" width="104" height="44" rx="8"/>
<text class="bt" x="60" y="147" text-anchor="middle">Choose care</text><text class="bs" x="60" y="162" text-anchor="middle">time, nurse, address</text>
<rect class="bx b-app" x="8" y="194" width="104" height="44" rx="8"/>
<text class="bt" x="60" y="213" text-anchor="middle">Pay</text><text class="bs" x="60" y="228" text-anchor="middle">Razorpay</text>
<rect class="bx b-admin" x="128" y="194" width="104" height="44" rx="8"/>
<text class="bt" x="180" y="213" text-anchor="middle">New booking</text><text class="bs" x="180" y="228" text-anchor="middle">alert to the team</text>
<rect class="bx b-admin" x="128" y="260" width="104" height="44" rx="8"/>
<text class="bt" x="180" y="279" text-anchor="middle">Confirm</text><text class="bs" x="180" y="294" text-anchor="middle">keeps or picks nurse</text>
<rect class="bx b-app bad" x="8" y="260" width="104" height="44" rx="8"/>
<text class="bt" x="60" y="279" text-anchor="middle">Declined?</text><text class="bs" x="60" y="294" text-anchor="middle">full refund</text>
<rect class="bx b-app" x="8" y="326" width="104" height="44" rx="8"/>
<text class="bt" x="60" y="345" text-anchor="middle">Confirmed</text><text class="bs" x="60" y="360" text-anchor="middle">nurse and date</text>
<rect class="bx b-nurse" x="248" y="326" width="104" height="44" rx="8"/>
<text class="bt" x="300" y="345" text-anchor="middle">Visit details</text><text class="bs" x="300" y="360" text-anchor="middle">SMS + email</text>
<rect class="bx b-nurse" x="248" y="392" width="104" height="44" rx="8"/>
<text class="bt" x="300" y="411" text-anchor="middle">Start visit</text><text class="bs" x="300" y="426" text-anchor="middle">at the address</text>
<rect class="bx b-nurse" x="248" y="458" width="104" height="44" rx="8"/>
<text class="bt" x="300" y="477" text-anchor="middle">Complete</text><text class="bs" x="300" y="492" text-anchor="middle">visit done</text>
<rect class="bx b-app end" x="8" y="458" width="104" height="44" rx="8"/>
<text class="bt" x="60" y="477" text-anchor="middle">Visit done</text><text class="bs" x="60" y="492" text-anchor="middle">in history</text>
</svg>
</div>
<ul class="notes">
<li><i style="background:var(--accent)"></i>Families get an SMS at each step: request received, confirmed, visit started, visit done.</li>
<li><i style="background:var(--danger)"></i>Cancel any time before the visit starts for a full refund. Unfinished payments are never charged.</li>
</ul>
<div class="more"><a class="linkbtn focusable" href="detailed.html">See the detailed flow <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></div>
</main>
</body>
</html>
